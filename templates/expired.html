<!DOCTYPE html>
<html>

<head>
    <title>Expired</title>
    <style>
        body {
            background: radial-gradient(circle at top, #111, #000);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            overflow: hidden;
            margin: 0;
        }

        .container {
            animation: fadeIn 2s ease;
        }

        h1 {
            font-size: 3rem;
            color: #ff4d4d;
            text-shadow: 0 0 20px rgba(255, 77, 77, 0.6);
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            color: #ccc;
        }

        .hourglass {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: rotate 3s infinite ease-in-out;
            display: inline-block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(180deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="hourglass">⏳</div>
        <h1>This moment has passed</h1>
        <p>But the memories remain forever.</p>
    </div>
</body>

</html>
