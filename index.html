<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Happy Birthday 🎉</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Start Screen -->
  <div class="start-screen" id="startScreen">
    <h1>🎧 Tap to Start</h1>
    <p>For the full cinematic experience ✨</p>
    <button onclick="startExperience()">Start 🎬</button>
  </div>

  <!-- Background Music -->
  <audio id="bgMusic" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
  </audio>

  <!-- Main Content -->
  <section class="intro hidden" id="intro">
    <h1 class="fade-in">Happy Birthday 🎂</h1>
    <p class="fade-in delay">May your day be magical ✨</p>
  </section>
  <section class="message hidden">
    <h2>Dear 💖</h2>
    <p>
      May your life be filled with happiness, love, and endless smiles.
    </p>
  </section>

  <script src="script.js"></script>
</body>

</html>
